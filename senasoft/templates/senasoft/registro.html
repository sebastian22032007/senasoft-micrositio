{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Senasoft</title>
    <link rel="stylesheet" href="{% static 'senasoft/css/estilos.css' %}">
</head>
<body>
    <header>
        <h1>Senasoft</h1>
        <nav>
            <a href="/senasoft/">Inicio</a>
            <a href="/senasoft/registro/">Registrarse</a>
            <a href="/senasoft/competidores/">Competidores</a>
        </nav>
    </header>
    <main>
        <h2>Registro de competidor</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Registrar</button>
        </form>
    </main>
</body>
</html>
