{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Competidores - Senasoft</title>
    <link rel="stylesheet" href="{% static 'senasoft/css/estilos.css' %}">
</head>
<body>
    <header>
        <h1>Senasoft</h1>
        <nav>
            <a href="/senasoft/">Inicio</a>
            <a href="/senasoft/registro/">Registrarse</a>
            <a href="/senasoft/competidores/">Competidores</a>
        </nav>
    </header>
    <main>
        <h2>Competidores inscritos</h2>
        <table>
            <tr>
                <th>Nombre</th>
                <th>Centro</th>
                <th>Categoría</th>
            </tr>
            {% for c in competidores %}
            <tr>
                <td>{{ c.nombre }}</td>
                <td>{{ c.centro }}</td>
                <td>{{ c.categoria }}</td>
            </tr>
            {% endfor %}
        </table>
    </main>
</body>
</html>
